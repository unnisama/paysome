<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment Decoder</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
        }
        .container {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        h1 {
            color: #fff;
            margin-bottom: 20px;
        }
        #amount {
            color: #fff;
        }
        .pay-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .pay-btn:hover {
            background: #45a049;
        }
        .pay-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="amount" style="font-size: 24px; font-weight: bold; margin-bottom: 20px; display: none;"></div>
        <a id="payBtn" class="pay-btn" disabled>Pay Now</a>
    </div>

    <script>
        function decodeBase64(str) {
            try {
                return decodeURIComponent(atob(str).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                throw new Error('Invalid base64 string');
            }
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function init() {
            const data = getQueryParam('data');
            const amountEl = document.getElementById('amount');
            const payBtn = document.getElementById('payBtn');

            if (!data) return;

            try {
                const decodedUpi = decodeBase64(data);
                
                // Extract amount from UPI string
                const amountMatch = decodedUpi.match(/&am=([^&]+)/);
                if (amountMatch) {
                    amountEl.textContent = '₹' + amountMatch[1];
                    amountEl.style.display = 'block';
                }

                // Set up pay button
                payBtn.href = decodedUpi;
                payBtn.disabled = false;
            } catch (error) {
                // Silent fail
            }
        }

        // Run on page load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
