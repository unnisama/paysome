<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Payment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #0f0f23;
        }

        .card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 600;
        }

        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }

        .amount-box {
            text-align: center;
            padding: 24px;
            background: rgba(102, 126, 234, 0.08);
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(102, 126, 234, 0.15);
        }

        .amount-label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .amount-value {
            color: #fff;
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .details {
            margin-bottom: 28px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
            font-size: 14px;
        }

        .detail-value {
            color: #ddd;
            font-size: 14px;
            font-weight: 500;
            text-align: right;
            word-break: break-all;
            max-width: 60%;
        }

        .pay-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .pay-btn:hover {
            opacity: 0.9;
        }

        .pay-btn:active {
            transform: scale(0.98);
        }

        .pay-btn:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
        }

        .pay-btn svg {
            width: 18px;
            height: 18px;
        }

        .error {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .error h2 {
            color: #ef4444;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .error p {
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
            </div>
            <h1>UPI Payment</h1>
            <p>Complete your payment</p>
        </div>

        <div id="content">
            <div class="amount-box">
                <div class="amount-label">Amount</div>
                <div class="amount-value" id="amount">₹0.00</div>
            </div>

            <div class="details" id="details">
                <div class="detail-row" id="payeeRow" style="display: none;">
                    <div class="detail-label">Payee</div>
                    <div class="detail-value" id="payeeValue">-</div>
                </div>
                <div class="detail-row" id="upiIdRow" style="display: none;">
                    <div class="detail-label">UPI ID</div>
                    <div class="detail-value" id="upiIdValue">-</div>
                </div>
            </div>

            <a id="payBtn" class="pay-btn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M12 2v20M2 12h20" stroke-linecap="round"></path>
                </svg>
                Pay Now
            </a>
        </div>

        <div class="error" id="error">
            <h2>Invalid Link</h2>
            <p>This payment link is corrupted or missing.</p>
        </div>
    </div>

    <script>
        function decodeBase64(str) {
            try {
                return decodeURIComponent(atob(str).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                throw new Error('Invalid base64 string');
            }
        }

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        function parseUPI(upiString) {
            try {
                const url = new URL(upiString);
                const params = new URLSearchParams(url.search);
                return {
                    pa: params.get('pa') || '',
                    pn: params.get('pn') || '',
                    am: params.get('am') || '',
                    cu: params.get('cu') || 'INR'
                };
            } catch {
                const am = upiString.match(/[?&]am=([^&]+)/);
                const pa = upiString.match(/[?&]pa=([^&]+)/);
                const pn = upiString.match(/[?&]pn=([^&]+)/);
                return {
                    pa: pa ? decodeURIComponent(pa[1]) : '',
                    pn: pn ? decodeURIComponent(pn[1]) : '',
                    am: am ? decodeURIComponent(am[1]) : '',
                    cu: 'INR'
                };
            }
        }

        function init() {
            const data = getQueryParam('data');
            const content = document.getElementById('content');
            const error = document.getElementById('error');

            if (!data) {
                content.style.display = 'none';
                error.classList.add('active');
                return;
            }

            try {
                const decodedUpi = decodeBase64(data);
                const upiData = parseUPI(decodedUpi);

                document.getElementById('amount').textContent = '₹' + (upiData.am || '0.00');

                if (upiData.pn) {
                    document.getElementById('payeeValue').textContent = upiData.pn;
                    document.getElementById('payeeRow').style.display = 'flex';
                }

                if (upiData.pa) {
                    document.getElementById('upiIdValue').textContent = upiData.pa;
                    document.getElementById('upiIdRow').style.display = 'flex';
                }

                const payBtn = document.getElementById('payBtn');
                payBtn.href = decodedUpi;
                payBtn.disabled = false;

            } catch (err) {
                content.style.display = 'none';
                error.classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
